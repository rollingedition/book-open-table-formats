[examples.file-counts-before-after]
say = "The code loads the six hours into a Delta Lake table, one append for each hour. It counts the data files the table lists, runs the compaction, and counts again. It prints the files before, the files added and removed by the compaction, the files after, and the row counts for the current version and for the version from before the compaction. Before the compaction the table has {{out:file-counts-before-after:files before compaction}} files. The compaction adds {{out:file-counts-before-after:files added by compaction}} and removes {{out:file-counts-before-after:files removed by compaction}}. Afterwards the table has {{out:file-counts-before-after:files after compaction}} file, and the current version returns {{out:file-counts-before-after:rows after compaction}} rows. The version from before the compaction returns {{out:file-counts-before-after:rows at the version before compaction}} rows. The directory holds {{out:file-counts-before-after:parquet files on disk after compaction}} Parquet files, the six old ones and the new one."

[examples.compact-ducklake]
say = "The code creates a DuckLake table with data inlining turned off, then inserts the six hours one insert at a time. It counts the data files, calls the merge function once, and counts again. It reads the merge function's result row, which gives the number of files merged and the number created. It then counts the rows now, counts the rows at the snapshot from before the merge, and counts the Parquet files on disk. The merge merges {{out:compact-ducklake:files merged}} files and creates {{out:compact-ducklake:files created}}. The table has {{out:compact-ducklake:data files after merge}} data file afterwards. The snapshot from before the merge still returns {{out:compact-ducklake:rows at the snapshot before merge}} rows, and {{out:compact-ducklake:parquet files on disk after merge}} Parquet files are on disk."

[examples.iceberg-rewrite-by-overwrite]
say = "The code creates an Iceberg table, appends the six hours with six separate appends, and counts the data files in the current snapshot. It then overwrites the table with its own scan, read as a stream of record batches, and counts again. It prints the operations of the snapshots in commit order, the rows of the snapshot from before the rewrite, and the Parquet files on disk. The table has {{out:iceberg-rewrite-by-overwrite:data files before rewrite}} data files before the rewrite and {{out:iceberg-rewrite-by-overwrite:data files after rewrite}} after it. The snapshot from before the rewrite still returns {{out:iceberg-rewrite-by-overwrite:snapshot 6 rows}} rows, and {{out:iceberg-rewrite-by-overwrite:parquet files on disk after rewrite}} Parquet files are on disk."

[[tables]]
section = "hourly-appends-leave-small-files"
starts = "| Format |"
say = "A table with one row for each of the three formats: Delta Lake, DuckLake and Iceberg. For each format it gives the call that compacts the table, then the number of data files before the call and the number after it. Delta Lake goes from {{out:file-counts-before-after:files before compaction}} files to {{out:file-counts-before-after:files after compaction}}. DuckLake goes from {{out:compact-ducklake:data files before merge}} to {{out:compact-ducklake:data files after merge}}. Iceberg goes from {{out:iceberg-rewrite-by-overwrite:data files before rewrite}} to {{out:iceberg-rewrite-by-overwrite:data files after rewrite}}."
